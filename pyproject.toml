[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sstre-assetcompiler"
version = "0.1.0.dev0"
description = "SSTRE edition detection, asset inventory, Classic texture codec and source selection for user-supplied Serious Sam installs (unofficial)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
authors = [{ name = "Handelsonderneming S.D. Broekhoven, trading as ITEagle Europe" }]
dependencies = []

[project.optional-dependencies]
# Image work (texture codec, PNG I/O, source selection). Pinned; licences:
# numpy BSD-3-Clause, Pillow MIT-CMU (HPND) - both GPL-3.0-compatible.
image = ["numpy==2.2.6", "pillow==12.3.0"]
test = ["pytest>=7", "jsonschema>=4.18", "numpy==2.2.6", "pillow==12.3.0"]

[project.scripts]
sstre-ac = "sstre_assetcompiler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sstre_assetcompiler = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
